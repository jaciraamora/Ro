<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chá de panela</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins,sans-serif;
background:#f3f3f3;
padding:20px;
}

.container{max-width:900px;margin:auto;}

h1{text-align:center;color:#1f2d45;margin-bottom:8px;}

.data{text-align:center;font-size:14px;color:#777;margin-bottom:15px;}

.countdown{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:20px;
}

.time-box{
background:#fff;
padding:12px;
border-radius:12px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,0.05);
}

.time-box h2{margin:0;color:#0090ad;font-size:22px;}
.time-box span{font-size:12px;color:#666;}

.box{
background:#fff;
padding:20px;
border-radius:16px;
margin-bottom:20px;
box-shadow:0 2px 8px rgba(0,0,0,0.05);
}

input, select{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:1px solid #ddd;
font-size:15px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
margin-top:10px;
font-size:16px;
font-weight:600;
cursor:pointer;
}

.btn-send{background:#0090ad;color:#fff;}

.btn-view{
width:50px;
height:14px;
background:#E5E5E5;
border:none;
border-radius:20px;
display:block;
margin:80px auto 0;
cursor:pointer;
}

.list{
display:none;
background:#fff;
padding:15px;
border-radius:12px;
margin-top:15px;
}

.item{
padding:8px 0;
border-bottom:1px solid #eee;
}

.btnExtra{
padding:10px 18px;
border:none;
border-radius:10px;
background:#ececec;
font-size:14px;
cursor:pointer;
}

.btnExtra:hover{background:#d8d8d8;}

#acoesLista{
display:none;
justify-content:center;
gap:12px;
margin-top:18px;
}
</style>
</head>

<body>

<div class="container">

<h1>Chá de panela da Marcela</h1>

<div class="data">📅 Confirmar até 10 de Novembro de 2026</div>

<div class="countdown">
<div class="time-box"><h2 id="days">0</h2><span>Dias</span></div>
<div class="time-box"><h2 id="hours">0</h2><span>Horas</span></div>
<div class="time-box"><h2 id="minutes">0</h2><span>Min</span></div>
<div class="time-box"><h2 id="seconds">0</h2><span>Seg</span></div>
</div>

<div class="box">

<h3>Confirmar Presença</h3>

<input type="text" id="nome" placeholder="Digite o seu nome completo">

<select id="presenca">
<option value="Sim">Sim</option>
<option value="Não">Não</option>
</select>

<button class="btn-send" id="btnEnviar">Enviar Confirmação</button>

<button class="btn-view" id="btnVer"></button>

<div class="list" id="listaConfirmados"></div>

<!-- AÇÕES DA LISTA (CORRIGIDO) -->
<div id="acoesLista">
<button id="btnCopiar" class="btnExtra">📋 Copiar Lista</button>
<button id="btnPDF" class="btnExtra">📄 Baixar PDF</button>
</div>

</div>
</div>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* CONFIGURAÇÃO DO FIREBASE */

const firebaseConfig = {

    apiKey: "AIzaSyAsSjgshsBDIhIKFJy1Zmncp9VW-512o0u0",

    authDomain: "evento-rsvp.firebaseapp.com",

    databaseURL: "https://evento-rsvp-default-rtdb.firebaseio.com",

    projectId: "evento-rsvp",

    storageBucket: "evento-rsvp.firebasestorage.app",

    messagingSenderId: "576746668608",

    appId: "1:576746668608:web:056ba17216dd8666ec95a5"

};


/* INICIALIZAR FIREBASE */

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


/* ==========================================
   CONTADOR
========================================== */

const target =
    new Date("2026-11-10T23:59:59").getTime();


function atualizarContador(){

    const agora = new Date().getTime();

    const diferenca = target - agora;


    if(diferenca <= 0){

        document.getElementById("days").innerText = "0";

        document.getElementById("hours").innerText = "0";

        document.getElementById("minutes").innerText = "0";

        document.getElementById("seconds").innerText = "0";

        return;
    }


    const dias =
        Math.floor(
            diferenca /
            (1000 * 60 * 60 * 24)
        );


    const horas =
        Math.floor(
            (diferenca %
            (1000 * 60 * 60 * 24))
            /
            (1000 * 60 * 60)
        );


    const minutos =
        Math.floor(
            (diferenca %
            (1000 * 60 * 60))
            /
            (1000 * 60)
        );


    const segundos =
        Math.floor(
            (diferenca %
            (1000 * 60))
            /
            1000
        );


    document.getElementById("days").innerText =
        dias;

    document.getElementById("hours").innerText =
        horas;

    document.getElementById("minutes").innerText =
        minutos;

    document.getElementById("seconds").innerText =
        segundos;
}


atualizarContador();

setInterval(
    atualizarContador,
    1000
);


/* ==========================================
   ENVIAR CONFIRMAÇÃO
========================================== */

document
.getElementById("btnEnviar")
.addEventListener("click", async ()=>{


    const nome =
        document
        .getElementById("nome")
        .value
        .trim();


    const presenca =
        document
        .getElementById("presenca")
        .value;


    if(nome === ""){

        alert("Escreve o teu nome.");

        return;
    }


    try{

        await push(
            ref(db,"marcela"),
            {
                nome: nome,
                presenca: presenca
            }
        );


        alert(
            "Confirmação enviada com sucesso! ❤️"
        );


        document
        .getElementById("nome")
        .value = "";


    }catch(erro){

        console.error(erro);

        alert(
            "Não foi possível enviar a confirmação. Verifica a ligação ao Firebase."
        );

    }

});


/* ==========================================
   LISTA DE CONFIRMADOS
========================================== */

const lista =
    document.getElementById(
        "listaConfirmados"
    );


let aberto = false;


onValue(
    ref(db,"marcela"),
    (snap)=>{


        lista.innerHTML = "";


        let temConfirmados = false;


        snap.forEach(
            (c)=>{


                const dados = c.val();


                if(
                    dados.presenca === "Sim"
                ){

                    temConfirmados = true;


                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "item";


                    item.innerText =
                        "✅ " + dados.nome;


                    lista.appendChild(
                        item
                    );

                }

            }
        );


        if(!temConfirmados){

            lista.innerHTML =
                "<div class='item'>Nenhum confirmado ainda.</div>";

        }

    }
);


/* ==========================================
   ABRIR / FECHAR LISTA
========================================== */

document
.getElementById("btnVer")
.addEventListener("click", ()=>{


    aberto = !aberto;


    lista.style.display =
        aberto
        ? "block"
        : "none";


    document.getElementById(
        "acoesLista"
    ).style.display =
        aberto
        ? "flex"
        : "none";

});


/* ==========================================
   COPIAR LISTA
========================================== */

document
.getElementById("btnCopiar")
.addEventListener("click", ()=>{


    let texto =
        "CONFIRMADOS - CHÁ DE PANELA DA MARCELA\n\n";


    document
    .querySelectorAll(
        "#listaConfirmados .item"
    )
    .forEach(
        (item)=>{

            texto +=
                item.innerText +
                "\n";

        }
    );


    navigator.clipboard
    .writeText(texto)
    .then(()=>{

        alert(
            "Lista copiada!"
        );

    })
    .catch(()=>{

        alert(
            "Não foi possível copiar a lista."
        );

    });

});


/* 

/* ==========================================
   GERAR PDF
========================================== */

document
.getElementById("btnPDF")
.addEventListener("click", ()=>{

    const { jsPDF } = window.jspdf;

    const pdf = new jsPDF();

    pdf.setFontSize(18);

    pdf.text(
        "Confirmados - Chá de Panela da Marcela",
        20,
        20
    );

    let y = 35;
    let numero = 1;

    document
    .querySelectorAll("#listaConfirmados .item")
    .forEach((item)=>{

        // Remove o emoji ✅ da lista
        const nome = item.innerText
            .replace("✅", "")
            .trim();

        pdf.setFontSize(12);

        // Enumeração
        pdf.text(
            numero + ". " + nome,
            20,
            y
        );

        numero++;
        y += 10;

        // Cria uma nova página se necessário
        if(y > 280){

            pdf.addPage();

            y = 20;
        }

    });

    pdf.save(
        "confirmados-cha-de-panela-marcela.pdf"
    );

});
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</body>
</html>
